# Create user group
-
    type: content
    mode: create
    metadata:
        contentType: user_group
        mainTranslation: fre-FR
        alwaysAvailable: true
    location:
        parentLocationId: 5
        locationRemoteId: minisites_users_root
        hidden: false
        sortField: 1
        sortOrder: 1
        priority: 0
    fields:
        -
            fieldDefIdentifier: name
            languageCode: fre-FR
            value: Contributeurs minisites
    references:
        -
            name: ref__minisites_users_root_content_id
            type: content_id

# Create media group
-
    type: content
    mode: create
    metadata:
        contentType: folder
        mainTranslation: fre-FR
        alwaysAvailable: true
    location:
        parentLocationId: 43
        locationRemoteId: minisites_medias_root
        hidden: false
        sortField: 1
        sortOrder: 1
        priority: 0
    fields:
        -
            fieldDefIdentifier: name
            languageCode: fre-FR
            value: Médias minisites
    references:
        -
            name: ref__minisites_medias_root_location_id
            type: location_id

# Create roles
-
    type: role
    mode: create
    metadata:
        identifier: 'Contributeur minisite'
    policies:
        -
            module: content
            function: read
        -
            module: content
            function: edit
        -
            module: content
            function: diff
        -
            module: content
            function: create
        -
            module: content
            function: publish
        -
            module: content
            function: hide
        -
            module: content
            function: manage_locations
        -
            module: content
            function: translate
        -
            module: content
            function: versionremove
        -
            module: content
            function: versionread
        -
            module: content
            function: view_embed
        -
            module: content
            function: remove
        -
            module: taxonomy
            function: assign
-
    type: role
    mode: create
    metadata:
        identifier: 'Contributeur minisite - Least access'
    policies:
        -
            module: user
            function: login
            limitations:
                -
                    identifier: SiteAccess
                    values: [admin]
        -
            module: content
            function: read
            limitations:
                -
                    identifier: Node
                    values: ['reference:ref__minisites_medias_root_location_id', '2', '43']
        -
            module: content
            function: read
            limitations:
                -
                    identifier: Section
                    values: [dashboard]
        -
            module: content
            function: read
            limitations:
                -
                    identifier: Section
                    values: [taxonomy]
        -
            module: content
            function: edit
            limitations:
                -
                    identifier: Group
                    values: ['1']
                -
                    identifier: Owner
                    values: ['1']
                -
                    identifier: Section
                    values: [dashboard]
        -
            module: content
            function: publish
            limitations:
                -
                    identifier: Owner
                    values: ['1']
                -
                    identifier: Section
                    values: [dashboard]
        -
            module: user
            function: password
        -
            module: user
            function: selfedit
        -
            module: taxonomy
            function: read
    actions:
        -   action: assign_role_to_user_group
            value:
                id: 'reference:ref__minisites_users_root_content_id'
